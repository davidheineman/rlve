actor-num-nodes: 1
actor-num-gpus-per-node: 4
num-gpus-per-node: 4
colocate: true

input-key: user_prompt
label-key: label
metadata-key: metadata
custom-prompt-preprocessor: ChatTemplate_NoSystemPrompt
apply-chat-template: true
custom-rm-path: program_trees.reward.reward
rm-type: math
reward-key: reward

num-rollout: 2500
num-steps-per-rollout: 1
rollout-batch-size: 1
n-samples-per-prompt: 8
over-sampling-batch-size: 1
rollout-max-prompt-len: 3072
rollout-max-response-len: 1024
answer-forcing: true
answer-forcing-extra-tokens: 128
rollout-temperature: 1.0
partial-rollout: true
balance-data: false

eval-interval: 50
eval-on-last-rollout: true
early-stop-val-accuracy: 0.98
n-samples-per-eval-prompt: 8
eval-input-key: user_prompt
eval-reward-key: accuracy
eval-max-response-len: 1024
eval-temperature: 0.7
eval-top-p: 0.95

tensor-model-parallel-size: 1
pipeline-model-parallel-size: 1
context-parallel-size: 1
expert-model-parallel-size: 1
expert-tensor-parallel-size: 1
recompute-granularity: full
recompute-method: uniform
recompute-num-layers: 1
optimizer-cpu-offload: true
overlap-cpu-optimizer-d2h-h2d: true
use-precision-aware-optimizer: true
use-dynamic-batch-size: true
max-tokens-per-gpu: 2048

advantage-estimator: grpo
entropy-coef: 0.0
eps-clip: 0.2
eps-clip-high: 0.28
use-tis: true
optimizer: adam
lr: 2.0e-6
lr-decay-style: constant
weight-decay: 0.01
adam-beta1: 0.9
adam-beta2: 0.98

rollout-num-gpus-per-engine: 1
sglang-mem-fraction-static: 0.15
sglang-server-concurrency: 64
attention-dropout: 0.0
hidden-dropout: 0.0
accumulate-allreduce-grads-in-fp32: true
attention-softmax-in-fp32: true
attention-backend: flash

use-wandb: true
wandb-always-use-train-step: true
disable-wandb-random-suffix: true
log-passrate: true
log-eval-rollouts: false
